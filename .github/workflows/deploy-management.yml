name: Deploy management account

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region where the management stacks deploy
        required: true
        type: string
        default: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-management
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mask region
        run: echo "::add-mask::${{ inputs.region }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_MANAGEMENT_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
      - run: |
          set -o pipefail
          npx cdk deploy --all --require-approval never 2>&1 | awk -f .github/scripts/redact-aws-log.awk
        env:
          AWS_REGION: ${{ inputs.region }}
